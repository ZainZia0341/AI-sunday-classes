[project]
name = "ai-sunday-classes"
version = "0.1.0"
description = "One optional local environment for all AI Sunday class notebooks"
requires-python = ">=3.12,<3.14"
dependencies = [
    "google-genai", "python-dotenv", "rank-bm25", "numpy", "pandas",
    "scikit-learn", "jupyterlab", "ipykernel", "nbformat", "nbclient",
    "matplotlib", "tiktoken", "transformers", "torch",
    "sentence-transformers", "anthropic", "pip",
]

[tool.uv]
package = false
